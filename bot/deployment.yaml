apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bot
  namespace: aibot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegram-bot
  template:
    metadata:
      labels:
        app: telegram-bot
    spec:
      containers:
      - name: telegram-bot
        image: ghcr.io/git-account/k3s-ollama@sha256:4adc1b58c460bc9f61b4ab47cf7bd0bfe60cd606926be739911716941f20eaf3
        env:
        - name: TELEGRAM_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegram-secret
              key: telegram-token
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"    # Give the bot pod room to breathe
            cpu: "1000m"
