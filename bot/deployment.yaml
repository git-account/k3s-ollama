apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bot
  namespace: aibot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegram-bot
  template:
    metadata:
      labels:
        app: telegram-bot
    spec:
      containers:
      - name: telegram-bot
        image: ghcr.io/git-account/k3s-ollama@sha256:ee0abc7e2f02f0bde02bec6cd82ad46d7422c07d1bb7c723be65f9b7dd34d55e
        env:
        - name: TELEGRAM_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegram-secret
              key: telegram-token
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"    # Give the bot pod room to breathe
            cpu: "1000m"
