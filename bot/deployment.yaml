apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bot
  namespace: aibot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegram-bot
  template:
    metadata:
      labels:
        app: telegram-bot
    spec:
      containers:
      - name: telegram-bot
        image: ghcr.io/git-account/k3s-ollama@sha256:136ae2ebdbd36cea9b1702ce497634a91ff62a5633c717cc5d14b4d3edbf378b
        env:
        - name: TELEGRAM_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegram-secret
              key: telegram-token
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"    # Give the bot pod room to breathe
            cpu: "1000m"
